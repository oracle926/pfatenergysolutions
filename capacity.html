<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="capacity.css" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />
    <title>Capacity Details</title>
</head>
<body>
    <header>
        <a href="index.html"> <img src="cap-img/your-logo.png" alt="Logo"> </a>
        <h1 id="capacityTitle"></h1>
        <div></div>
    </header>

    <main>
        <h2>WHAT IT COVERS</h2>
        <ul id="itemsList"></ul>
    </main>

    <footer>
        <a href="contact.html" class="contact-button">CONTACT</a>
    </footer>

    <script>
        const items = {
            '2.5KVA': [
                { name: 'TV', bg: 'cap-img/tv-bg.jpg' },
                { name: 'Fan', bg: 'cap-img/fan-bg1.jpg' },
                { name: 'Lights', bg: 'cap-img/lights-bg.jpg' },
                { name: 'Sound System', bg: 'cap-img/sound-bg.jpg' }
            ],
            '1KVA': [
                { name: 'TV', bg: 'cap-img/tv-bg.jpg' },
                { name: 'Fan', bg: 'cap-img/fan-bg1.jpg' },
                { name: 'Lights', bg: 'cap-img/lights-bg.jpg' },
                { name: 'Sound System', bg: 'cap-img/sound-bg.jpg' }
            ],
            '5KVAT': [
                { name: 'TV', bg: 'cap-img/tv-bg.jpg' },
                { name: 'Fan', bg: 'cap-img/fan-bg1.jpg' },
                { name: 'Lights', bg: 'cap-img/lights-bg.jpg' },
                { name: '1HP Inverter AC', bg: 'cap-img/ac-bg.jpg' },
                { name: 'Refrigerator', bg: 'cap-img/refrigerator-bg.jpg' },
                { name: 'Sound System', bg: 'cap-img/sound-bg.jpg' }
            ],
            '5KVA': [
                { name: 'TV', bg: 'cap-img/tv-bg.jpg' },
                { name: 'Fan', bg: 'cap-img/fan-bg1.jpg' },
                { name: 'Lights', bg: 'cap-img/lights-bg.jpg' },
                { name: 'Refrigerator', bg: 'cap-img/refrigerator-bg.jpg' },
                { name: 'Sound System', bg: 'cap-img/sound-bg.jpg' },
                { name: 'Water Pump', bg: 'cap-img/water-bg.jpg' }
            ],
            '5KVAL': [
                { name: 'TV', bg: 'cap-img/tv-bg.jpg' },
                { name: 'Fan', bg: 'cap-img/fan-bg1.jpg' },
                { name: 'Lights', bg: 'cap-img/lights-bg.jpg' },
                { name: '1HP Inverter AC', bg: 'cap-img/ac-bg.jpg' },
                { name: 'Refrigerator', bg: 'cap-img/refrigerator-bg.jpg' },
                { name: 'Sound System', bg: 'cap-img/sound-bg.jpg' },
                { name: 'Blender', bg: 'cap-img/blend-bg.jpg' },
                { name: 'Toaster', bg: 'cap-img/toast-bg.jpg' },
                { name: 'Washing Machine', bg: 'cap-img/wash-bg.jpg' }
            ],
            '10KVA': [
                { name: 'TV', bg: 'cap-img/tv-bg.jpg' },
                { name: 'Fan', bg: 'cap-img/fan-bg1.jpg' },
                { name: 'Lights', bg: 'cap-img/lights-bg.jpg' },
                { name: '1HP Inverter AC', bg: 'cap-img/ac-bg.jpg' },
                { name: 'Refrigerator', bg: 'cap-img/refrigerator-bg.jpg' },
                { name: 'Sound System', bg: 'cap-img/sound-bg.jpg' },
                { name: 'Blender', bg: 'cap-img/blend-bg.jpg' },
                { name: 'Microwave', bg: 'cap-img/microwave-bg.jpg' },
                { name: 'Toaster', bg: 'cap-img/toast-bg.jpg' },
                { name: 'Washing Machine', bg: 'cap-img/wash-bg.jpg' },
                { name: 'Water Pump', bg: 'cap-img/water-bg.jpg' }
            ]
        };

        function loadCapacity() {
            // Get capacity from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const capacity = urlParams.get('capacity') || '10KVA';
            
            // Set title
            document.getElementById('capacityTitle').textContent = capacity + ' Capacity';
            
            // Clear and populate items list
            const itemsList = document.getElementById('itemsList');
            itemsList.innerHTML = '';
            
            items[capacity].forEach(item => {
                const li = document.createElement('li');
                li.style.backgroundImage = `url('${item.bg}')`;
                li.style.color = 'black';
                li.textContent = item.name;
                itemsList.appendChild(li);
            });
        }

        // Load content when page loads
        window.onload = loadCapacity;
    </script>
</body>
</html>
